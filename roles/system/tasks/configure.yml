---
- name: Set the hostname
  when: domain_name is defined
  become: true
  ansible.builtin.hostname:
    name: "{{ domain_name }}"
- name: Set timezone
  become: true
  community.general.timezone:
    name: "{{ timezone }}"
- name: Remove mail_badpass from sudoers
  ansible.builtin.replace:
    group: root
    mode: "0440"
    owner: root
    path: /etc/sudoers
    regexp: (^Defaults.*mail_badpass$)|(\,mail_badpass)
    replace: ""
    validate: /usr/sbin/visudo -cf %s
  become: true
- name: Adding pwfeedback
  ansible.builtin.copy:
    content: |
      Defaults        pwfeedback
    dest: /etc/sudoers.d/02-pwfeedback
    group: root
    mode: "0440"
    owner: root
    validate: /usr/sbin/visudo -cf %s
  become: true
- name: Disable wifi and bluetooth
  ansible.builtin.copy:
    content: |
      install cfg80211 /bin/false
      install bluetooth /bin/false
    dest: /etc/modprobe.d/disable-radio.conf
    group: root
    mode: "0644"
    owner: root
  become: true
- name: Configure systemd-journald to persist storage
  ansible.builtin.include_role:
    name: persist_journald
    apply:
      become: true
# TODO: clean this up, it works it needs to be refined
# TODO: test this with debian, its only been tested with ubuntu 26
- name: Configure dropbear for remote LUKS unlock
  when: "'encrypted_boot' in group_names"
  become: true
  block:
    - name: Install dropbear-initramfs
      ansible.builtin.apt:
        name: dropbear-initramfs
        state: present
    - name: Configure dropbear options
      ansible.builtin.copy:
        content: |
          DROPBEAR_OPTIONS="-I 180 -j -k -p 22 -s -c cryptroot-unlock"
        dest: /etc/dropbear/initramfs/dropbear.conf
        owner: root
        group: root
        mode: "0644"
      notify: Rebuild initramfs
    - name: Write dropbear authorized key
      ansible.builtin.copy:
        content: "{{ dropbear_authorized_key }}\n"
        dest: /etc/dropbear/initramfs/authorized_keys
        owner: root
        group: root
        mode: "0600"
      notify: Rebuild initramfs
    - name: Reuse openssh host keys for dropbear
      ansible.builtin.command:
        cmd: dropbearconvert openssh dropbear /etc/ssh/ssh_host_{{ item }}_key /etc/dropbear/initramfs/dropbear_{{ item }}_host_key
        creates: /etc/dropbear/initramfs/dropbear_{{ item }}_host_key
      loop:
        - rsa
        - ed25519
        # uneeded?
        - ecdsa
      notify: Rebuild initramfs
